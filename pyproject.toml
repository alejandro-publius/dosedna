[tool.ruff]
# Only Python in this repo: server/ (the FastAPI proxy) and scripts/ (offline
# data-prep tools). Everything else is JS/HTML.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ruff's own unconfigured default (E4, E7, E9, F) made explicit, plus import
# sorting (I). Deliberately not pulling in UP/SIM/B/etc: those flag mostly
# style preferences (Optional[X] vs X | None, long natural-language string
# literals) rather than bugs, and fixing them would rewrite swaths of
# already-working, deliberately-styled code for no behavior change.
select = ["E4", "E7", "E9", "F", "I"]
