name: CI

# Only the suites that run offline, no proxy or model required. The others
# in the Makefile (agent-test, pgxqa-test, lit-test) talk to a live proxy on
# localhost:8001 and a model behind it, so they stay a local check. `getrm`
# is also offline but currently has zero fixtures (scaffold only — see the
# TODO at the top of tests/getrm.test.mjs), so it's not worth a CI step yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Phenotype engine (79 cases against CPIC's published calls)
        run: make pgx-test

      - name: Raw-file parser (33 cases, 23andMe and Ancestry layouts)
        run: make parser-test

      - name: Privacy boundary (client never sends genotype-derived raw data)
        run: make privacy-test

      - name: Diplotype known-answer table (het / hom / uncallable per gene)
        run: make known-answer-test

      - name: Patient pipeline benchmark (19 file → parser → engine assertions, no API needed)
        run: make benchmark

  proxy:
    # The FastAPI proxy is the only server-side code. It refuses to start a
    # live server without a real API key, so this job never boots uvicorn —
    # it proves the pinned requirements still resolve, the module compiles,
    # and (server/test_proxy.py) that the claim-boundary logic inside it is
    # correct. That test needs ANTHROPIC_API_KEY set to SOMETHING to get past
    # the module's own import-time guard, but never makes a network call —
    # every function that would reach Anthropic is monkeypatched first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install the proxy's requirements
        run: pip install -r server/requirements.txt

      - name: Compile
        run: python -m py_compile server/proxy.py scripts/cache_cpic.py scripts/precompute_explanations.py

      - name: Claim-boundary tests (BUILD_SPEC §15 denylist, mocked model calls, no network)
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder-not-real
        run: make proxy-test

      - name: Lint (ruff)
        # Pinned, not floating. An unpinned linter turns every new ruff
        # release into a surprise red main: 0.16 enabled SIM117 by default
        # and broke a sibling repo's build the day it landed. Bump this
        # deliberately, with the findings reviewed, not by accident.
        run: pipx run ruff==0.16.6 check .
